<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Aplikasi Quran</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1>Aplikasi Quran By ruangbimbel</h1>
    <p>Assalamu Alaikum !!!</p>
    <h2>Masuk</h2>

    <input type="text" id="username" placeholder="Nama Pengguna" class="input-field">

    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Kata Sandi" class="input-field">
      <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
    </div>
    
    <button class="sign-in-btn">Masuk</button>

    <p>Belum punya akun? <a href="https://adhaedieswulandari1212.github.io/Quran-Apps/">Daftar di sini</a></p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database.js"></script>

  <script>
    // Konfigurasi Firebase
    const firebaseConfig = {
  apiKey: "AIzaSyBUxnG7la9iTjJhEAd84mQK1CX8k6HpBeA",
  authDomain: "storage-quran-apps.firebaseapp.com",
  databaseURL: "https://storage-quran-apps-default-rtdb.firebaseio.com/", // Ganti dengan URL Anda 
  projectId: "storage-quran-apps",
  storageBucket: "storage-quran-apps.firebasestorage.app",
  messagingSenderId: "898333825018",
  appId: "1:898333825018:web:47a43b54542dc91dd2b643"
};

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    function togglePasswordVisibility() {
      const kataSandi = document.getElementById('password');
      kataSandi.type = kataSandi.type === 'password' ? 'text' : 'password';
    }

    document.querySelector('.sign-in-btn').addEventListener('click', function() {
      const username = document.getElementById('username').value;
      const kataSandi = document.getElementById('password').value;

      // Mengambil semua pengguna untuk mencari email berdasarkan nama pengguna
      database.ref('users').once('value')
        .then((snapshot) => {
          const users = snapshot.val();
          let userEmail = null;

          // Mencari email berdasarkan nama pengguna
          for (let uid in users) {
            if (users[uid].username === username) {
              userEmail = users[uid].email;
              break;
            }
          }

          if (!userEmail) {
            alert('Nama pengguna tidak ditemukan!');
            return;
          }

          // Masuk dengan Firebase Authentication
          auth.signInWithEmailAndPassword(userEmail, kataSandi)
            .then((userCredential) => {
              const user = userCredential.user;

              // Mengambil data pengguna dari Realtime Database
              database.ref('users/' + user.uid).once('value')
                .then((snapshot) => {
                  const userData = snapshot.val();
                  localStorage.setItem('penggunaLogin', JSON.stringify(userData));
                  alert('Masuk berhasil!');
                  window.location.href = 'https://adhaedieswulandari1212.github.io/hadeuh/';
                });
            })
            .catch((error) => {
              console.error('Gagal masuk:', error);
              alert('Nama pengguna atau kata sandi salah: ' + error.message);
            });
        })
        .catch((error) => {
          console.error('Gagal mencari nama pengguna:', error);
          alert('Gagal mencari nama pengguna: ' + error.message);
        });
    });
  </script>
</body>

<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f9f9f9;
  margin: 0;
}

.container {
  text-align: center;
  width: 300px;
}

h1 {
  color: purple;
  font-size: 24px;
}

p {
  color: purple;
  margin-bottom: 20px;
}

h2 {
  font-size: 18px;
  margin-bottom: 20px;
}

.input-field {
  width: 92%;
  padding: 10px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
  border-radius: 5px;
  background-color: #e1bee7;
}

.password-wrapper {
  position: relative;
}

.toggle-password {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
}

.sign-in-btn {
  display: block;
  width: 100%;
  padding: 10px;
  background-color: #ba68c8;
  color: white;
  text-align: center;
  border-radius: 5px;
  text-decoration: none;
  font-weight: bold;
  border: none;
  cursor: pointer;
}

.sign-in-btn:hover {
  background-color: #9c27b0;
}

a {
  color: #1a73e8;
  text-decoration: none;
}
</style>
